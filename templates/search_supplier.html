<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Supplier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='display_supplier.css') }}">
</head>

<body>

    {% include "sidebar_controls.html" %}

    <!-- 1. Divide screen into Sidebar + Main CONTENT -->
    <div class="page-container">

        <!-- 2. Left Side Navigation Menu -->
        {% include "sidebar_supplier.html" %}

        <!-- 3. Right Side Menu Content -->
        <main class="main-content">
            <h3>Search Supplier</h3><br>

            {% if message and request.args.get('name') is not none %}
            <p>{{ message }}</p>
            {% endif %}


            <!-- FIND SUPPLIER -->
            <form action="search_supplier" method="GET">

                <div class="button-area">
    
                    <label>Supplier </label>
                    <input type="text" name="name" placeholder="Search">
                    <button type="submit">Submit</button>

                </div>
            </form>

            <!-- DISPLAY SEARCHED SUPPLIERS -->
            {% if rows %}
            <br><br><br>
            <h3>Suppliers Found</h3><br>

            {% for row in rows %}
           
            <div class="searchform-columns" style="margin-bottom: 40px;">
           
                <label>Id </label>
                <input type="number" name="supplier_id" value="{{ row[0] }}" readonly>

                <label>Name </label>
                <input type="text" name="name" value="{{ row[1] }}" readonly>

                <label>Account </label>
                <input type="text" name="account" value="{{ row[2] }}" readonly>

                <label>Terms </label>
                <input type="number" name="terms" value="{{ row[3] }}" readonly>

                <label>Firstline </label>
                <input type="text" name="street" value="{{ row[4] }}" readonly >

                <label>Town </label>
                <input type="text" name="town" value="{{ row[5] }}" readonly>

                <label>City </label>
                <input type="text" name="city" value="{{ row[6] }}" readonly>

                <label>Postcode </label>
                <input type="text" name="postcode" value="{{ row[7] }}" readonly>

                <label>Contact </label>
                <input type="text" name="contactname" value="{{ row[8] }}" readonly>

                <label>Telephone</label>
                <input type="text" name="contactnum" value="{{ row[9] }}" readonly>

                <label>Active </label>
                <input type="boolean" name="is_active" value="{{ row[10] }}" readonly>

                <label>Created </label>
                <input type="timestamp" name="created_at" value="{{ row[11] }}" readonly>

                <label>Updated </label>
                <input type="timestamp" name="updated_at" value="{{ row[12] }}" readonly>
                
            </div>

            {% endfor %}
            {% endif %}

        </main>
    </div>

</body>
</html>
