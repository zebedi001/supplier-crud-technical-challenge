<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Supplier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='add_supplier.css') }}">
</head>

<body>
    
    {% include "sidebar_controls.html" %}
    
    <!-- 1. Divide screen into Sidebar + Main CONTENT -->
    <div class="page-container">
        
        <!-- 2. Left Side Navigation Menu" -->
        {% include "sidebar_supplier.html" %}
      
        <!-- 3. Right Side Menu Content -->
        <main class="main-content">
            <h3>Create Supplier</h3><br>

            {% if message %}
            <p>{{ message }}</p>
            {% endif %}

            <form action="/add_supplier" method="POST">
                <div class="addform-columns">
            
                    <label>Name: </label>
                    <input type="text" name="name">
            
                    <label>Account No: </label>
                    <input type="text" name="account">
            
                    <label>Terms (Days): </label>
                    <input type="number" name="terms">
            
                    <label>First Line: </label>
                    <input type="text" name="street">
            
                    <label>Town: </label>
                    <input type="text" name="town">

                    <label>City: </label>
                    <input type="text" name="city">
            
                    <label>Postcode: </label>
                    <input type="text" name="postcode">
            
                    <label>Contact Name: </label>
                    <input type="text" name="contactname">
            
                    <label>Contact Number: </label>
                    <input type="text" name="contactnum">
            
                </div>
                
                <div class="button-area">
                    <br><br>    
                    <button type="submit">Submit Supplier</button>
                    <button type="button">Cancel</button>
                </div>
            
            </form>
        </main>    
    </div>   

</body>

</html>
