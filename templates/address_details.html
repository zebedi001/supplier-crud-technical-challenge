<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
</head>

<body>

<!-- 1. Divide screen into Sidebar + Main CONTENT -->
    <div class="page-container">
        
        <!-- 2. Left Side Navigation Menu" -->
        {% include "sidebar_supplier.html" %}
      
        <!-- 3. Right Side Menu Content -->
        <main class="main-content">
            <h3>Address Details</h3>

            <table cellspacing="35">
                <tr>
                    <th>ID</th>
                    <th>Supplier Name</th>
                    <th>Street</th>
                    <th>Town</th>
                    <th>City</th>
                    <th>Postcode</th>
                </tr>
    
                {% for row in rows %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[4] }}</td>
                    <td>{{ row[5] }}</td>
                    <td>{{ row[6] }}</td>
                    <td>{{ row[7] }}</td>
                </tr>
                {% endfor %}
            </table>
        </main>
        
</body>
</html>
